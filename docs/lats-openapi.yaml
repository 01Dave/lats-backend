openapi: 3.0.3
info:
  title: LATS API — Loan Application Tracking System
  version: "0.6.2"
  description: >
    Contract for the endpoints that are implemented today (Phase 1, Steps 1–6).
    Six-stage workflow: Sales → HOD → Credit Review → Internal Control → MD →
    Finance. Every status transition is enforced server-side by the workflow
    state machine; the frontend should treat `status` and the user's
    `permissions` as the source of truth for which actions to show.


    LATS is a digital tracker for a process that stays physical for identity and
    KYC checks. There is no customer record, product catalog, BVN, or KYC
    checklist; KYC is confirmed by HOD with a single `kycConfirmed` flag on the
    HOD approval.


    **Status chaining.** Some transitions pass through an intermediate status
    and land on the next stage in one call. Responses never show the
    intermediate value: `submit` returns `HOD_IN_REVIEW` (not `SUBMITTED`); an
    HOD approval returns `CREDIT_IN_REVIEW` (not `HOD_APPROVED`); a Credit Review
    approval returns `IC_IN_REVIEW`; an Internal Control approval returns
    `PENDING_MD`; an MD approval returns `PENDING_DISBURSEMENT`.


    **`GET /applications` response shape changed** (breaking): it now
    returns `{ data, pagination }` instead of a bare array, and accepts
    `status`/`branch`/`page`/`limit` query params. `status`/`branch` only
    narrow a caller's own visibility scope, never widen it.


    **Not implemented yet:** editing an application once it's past DRAFT
    (including after a query response), PDF export, reports, case-owner
    assignment/reassignment. (Self-service password change and a
    separate audit-log endpoint are both deliberately out of scope —
    password reset is admin-only by design, and the `Approval` table
    already is the audit trail for workflow decisions.)
servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: Health
  - name: Auth
  - name: Applications
  - name: Approvals
  - name: Comments
  - name: Documents
  - name: Admin

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness check (mounted at the server root, not under /api/v1)
      security: []
      servers:
        - url: /
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  # ---------- AUTH ----------
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: JWT; send as `Authorization Bearer <token>` }
                  expiresIn: { type: string, example: 12h }
                  user:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      email: { type: string }
                      name: { type: string }
                      role: { $ref: "#/components/schemas/Role" }
                      permissions:
                        type: array
                        items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "423":
          description: Account is inactive (`ACCOUNT_INACTIVE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >-
            Too many login attempts for this IP + email (`TOO_MANY_REQUESTS`).
            Default limit 5 per 15 minutes; a successful login resets the count.
          headers:
            Retry-After:
              description: Seconds until another attempt is allowed
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/me:
    get:
      tags: [Auth]
      summary: The authenticated user
      responses:
        "200":
          description: Current user (note — `name` is not included here)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string }
                  role: { $ref: "#/components/schemas/Role" }
                  branch: { type: string, nullable: true }
                  permissions:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------- APPLICATIONS ----------
  /applications:
    get:
      tags: [Applications]
      summary: List applications visible to the caller
      description: >
        Scoped server-side by permission: `application:view:own` (Sales — only
        applications they created), `application:view:branch` (HOD, Credit
        Review — same branch), `application:view:all` (Internal Control, MD,
        Finance, Admin). `status`/`branch` filter on top of that scope — they
        can only narrow the result, never show something outside it. Newest
        first within a page.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ApplicationStatus" }
        - name: branch
          in: query
          required: false
          schema: { type: string, minLength: 1 }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Applications, paginated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Applications]
      summary: Create an application (status DRAFT)
      description: Requires `application:create` (Sales).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /applications/{id}:
    parameters:
      - $ref: "#/components/parameters/AppId"
    get:
      tags: [Applications]
      summary: Get one application
      description: An application outside the caller's visibility scope returns 404, not 403.
      responses:
        "200":
          description: The application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Applications]
      summary: Edit an application while it is still DRAFT
      description: >
        Only the Sales user who created it, and only while status is DRAFT —
        any other status returns 409. All fields optional; send only what's
        changing. There is no way to edit an application once it's past
        DRAFT, including after a query response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationUpdateRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Application is not DRAFT (`CONFLICT`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /applications/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/AppId"
    post:
      tags: [Applications]
      summary: Submit a draft to HOD
      description: >
        Only the Sales user who created the application can submit it (anyone
        else gets 404). Returns status `HOD_IN_REVIEW`. No request body.
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }

  /applications/{id}/withdraw:
    parameters:
      - $ref: "#/components/parameters/AppId"
    post:
      tags: [Applications]
      summary: Withdraw an application from any open status
      description: Requires `application:withdraw` (Sales, Admin). Recorded in the approval history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string, minLength: 1 }
      responses:
        "200":
          description: Withdrawn (status `WITHDRAWN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ---------- APPROVAL DECISIONS ----------
  /applications/{id}/hod-decision:
    parameters:
      - $ref: "#/components/parameters/AppId"
    post:
      tags: [Approvals]
      summary: HOD decision (from HOD_IN_REVIEW)
      description: >
        Requires `hod:approve`. `approve` requires `kycConfirmed: true`
        (physical KYC checked) or the call is rejected with 422; on success it
        records who confirmed and when, and returns `CREDIT_IN_REVIEW`. `query`
        returns `HOD_QUERY` and needs a comment. `reject` returns `HOD_REJECTED`
        (closed) and needs a comment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, query, reject] }
                comment: { type: string, minLength: 1 }
                kycConfirmed: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/ApplicationUpdated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /applications/{id}/credit-decision:
    parameters:
      - $ref: "#/components/parameters/AppId"
    post:
      tags: [Approvals]
      summary: Credit Review decision (from CREDIT_IN_REVIEW)
      description: >
        Requires `credit:review`. `approve` returns `IC_IN_REVIEW`; `query`
        returns `CREDIT_QUERY`; `decline` returns `CREDIT_DECLINED` (closed).
        `query` and `decline` need a comment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, query, decline] }
                comment: { type: string, minLength: 1 }
      responses:
        "200": { $ref: "#/components/responses/ApplicationUpdated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /applications/{id}/internal-control-decision:
    parameters:
      - $ref: "#/components/parameters/AppId"
    post:
      tags: [Approvals]
      summary: Internal Control decision (from IC_IN_REVIEW)
      description: >
        Requires `control:verify`. `approve` returns `PENDING_MD`; `query`
        returns `IC_QUERY`; `reject` returns `IC_REJECTED` (closed). `query`
        and `reject` need a comment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, query, reject] }
                comment: { type: string, minLength: 1 }
      responses:
        "200": { $ref: "#/components/responses/ApplicationUpdated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /applications/{id}/md-decision:
    parameters:
      - $ref: "#/components/parameters/AppId"
    post:
      tags: [Approvals]
      summary: MD decision (from PENDING_MD)
      description: >
        Requires `approval:md`. `approve` returns `PENDING_DISBURSEMENT`;
        `reject` returns `MD_REJECTED` (closed) and needs a comment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                comment: { type: string, minLength: 1 }
      responses:
        "200": { $ref: "#/components/responses/ApplicationUpdated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /applications/{id}/resolve-query:
    parameters:
      - $ref: "#/components/parameters/AppId"
    post:
      tags: [Approvals]
      summary: Answer a query and send the case back into review
      description: >
        One endpoint for all three query states; which one applies is inferred
        from the current status. The role allowed to call it depends on the
        status: Sales for `HOD_QUERY` (returns `HOD_IN_REVIEW`), HOD for
        `CREDIT_QUERY` (returns `CREDIT_IN_REVIEW`), Credit Review for
        `IC_QUERY` (returns `IC_IN_REVIEW`). Any other role gets 409. Calling it
        when the application is not in a query status returns 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string, minLength: 1 }
      responses:
        "200": { $ref: "#/components/responses/ApplicationUpdated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /applications/{id}/disburse:
    parameters:
      - $ref: "#/components/parameters/AppId"
    post:
      tags: [Approvals]
      summary: Record disbursement (from PENDING_DISBURSEMENT)
      description: >
        Requires `disbursement:record` (Finance). Valid only from
        `PENDING_DISBURSEMENT`; returns `DISBURSED`, a real resting/closed
        status — not auto-chained anywhere further. No comment is required.
        `disbursedById`/`disbursedAt` are set server-side from the
        authenticated actor and the server clock, not from the request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disbursedAmount, disbursementDate, disbursementMethod]
              properties:
                disbursedAmount: { type: number, minimum: 0, exclusiveMinimum: true }
                disbursementDate: { type: string, format: date }
                disbursementMethod: { type: string, minLength: 1, example: "Bank Transfer" }
                disbursementReference: { type: string, minLength: 1 }
                comment: { type: string, minLength: 1 }
      responses:
        "200": { $ref: "#/components/responses/ApplicationUpdated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /applications/{id}/approvals:
    parameters:
      - $ref: "#/components/parameters/AppId"
    get:
      tags: [Approvals]
      summary: Decision history for an application (oldest first)
      description: >
        One row per decision, including query resolutions and withdrawal. Use
        this for a case timeline.
      responses:
        "200":
          description: Decision history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Approval" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- COMMENTS ----------
  /applications/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/AppId"
    get:
      tags: [Comments]
      summary: Free-standing case notes (oldest first)
      description: Separate from the comment attached to a decision, which is on the approval history.
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Comments]
      summary: Add a case note
      description: Requires `comment:create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ---------- DOCUMENTS ----------
  /applications/{id}/documents:
    parameters:
      - $ref: "#/components/parameters/AppId"
    get:
      tags: [Documents]
      summary: List documents, all versions
      description: Requires `document:view`. Ordered by `docType`, then newest version first.
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Documents]
      summary: Upload a document
      description: >
        Requires `document:upload`. PDF, JPG or PNG, up to 10 MB. The file's
        actual content must match its declared type (checked from the file's
        leading bytes, not just the `Content-Type` header) — a text file
        renamed to `.pdf` is rejected with `422`. Uploading the same
        `docType` again creates a new version and marks the previous one
        `current: false`; nothing is overwritten. New documents start as
        `pending`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, docType]
              properties:
                file: { type: string, format: binary }
                docType:
                  type: string
                  description: Free text label, e.g. "Government ID". Not validated against a list.
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /applications/{id}/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/AppId"
      - name: documentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Documents]
      summary: Download a document
      description: Requires `document:view`. Returns the file as an attachment.
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Documents]
      summary: Set a document's review status
      description: >
        Requires `document:verify` (HOD, Credit Review, Internal Control,
        Admin). Independent of the workflow — nothing else depends on this
        status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/DocumentStatus" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ---------- ADMIN ----------
  /admin/users:
    post:
      tags: [Admin]
      summary: Create a user
      description: >
        Requires `admin:users`. `branch` is required when `role` is
        `sales`, `hod`, or `credit_review` (the branch-scoped roles) and
        optional otherwise. `email` must be unique.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password, role]
              properties:
                email: { type: string, format: email }
                name: { type: string, minLength: 1 }
                password: { type: string, minLength: 8, description: Set directly by the admin; no email/token flow. }
                role: { $ref: "#/components/schemas/Role" }
                branch: { type: string, minLength: 1 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [Admin]
      summary: List all users
      description: Requires `admin:users`. Bare array, no pagination.
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Admin]
      summary: Get one user
      description: Requires `admin:users`.
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Admin]
      summary: Update a user
      description: >
        Requires `admin:users`. At least one field required. An admin
        cannot deactivate their own account or change their own role away
        from `admin` — `403`, even though they hold `admin:users`. Same
        branch-requirement rule as create applies when `role` is changed
        (or already is) one of the branch-scoped roles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1 }
                role: { $ref: "#/components/schemas/Role" }
                branch: { type: string, minLength: 1, nullable: true }
                active: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/users/{id}/reset-password:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin]
      summary: Set a user's password directly
      description: >
        Requires `admin:users`. No email/token flow — a bank-internal tool
        for an admin who already has account-management authority. No
        restriction on resetting your own password this way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AppId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ApplicationUpdated:
      description: The application after the decision, with its new status
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Application" }
    Unauthorized:
      description: Missing or invalid token (`UNAUTHENTICATED`, `INVALID_TOKEN`, `ACCOUNT_INACTIVE`, or `INVALID_CREDENTIALS` on login)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but missing the required permission (`FORBIDDEN`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found, or outside the caller's visibility scope (`NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidTransition:
      description: >
        The workflow does not allow this action now — wrong starting status,
        wrong role for the action, or a required comment is missing
        (`INVALID_TRANSITION`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Request body failed validation (`VALIDATION_ERROR`); `message` lists every failing field
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Already exists, or otherwise conflicts with current state (`CONFLICT`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string }

    Role:
      type: string
      enum: [sales, hod, credit_review, internal_control, md, finance, admin]

    User:
      type: object
      description: >
        passwordHash is never included in any response, from this or any
        other endpoint in the system.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        branch: { type: string, nullable: true }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ApplicationStatus:
      type: string
      enum:
        - DRAFT
        - SUBMITTED
        - HOD_IN_REVIEW
        - HOD_QUERY
        - HOD_APPROVED
        - HOD_REJECTED
        - CREDIT_IN_REVIEW
        - CREDIT_QUERY
        - CREDIT_APPROVED
        - CREDIT_DECLINED
        - IC_IN_REVIEW
        - IC_QUERY
        - IC_APPROVED
        - IC_REJECTED
        - PENDING_MD
        - MD_APPROVED
        - MD_REJECTED
        - PENDING_DISBURSEMENT
        - DISBURSED
        - WITHDRAWN
      description: >
        Closed (no further action): HOD_REJECTED, CREDIT_DECLINED, IC_REJECTED,
        MD_REJECTED, DISBURSED, WITHDRAWN. SUBMITTED, HOD_APPROVED,
        CREDIT_APPROVED, IC_APPROVED and MD_APPROVED exist in the model but are
        never returned by the API — they chain straight to the next stage.

    ApplicationCreateRequest:
      type: object
      required: [branch, productName, customerName, customerPhone, requestedAmount, tenorMonths, purpose]
      properties:
        branch: { type: string, minLength: 1 }
        productName: { type: string, minLength: 1, description: Free text — there is no product catalog }
        customerName: { type: string, minLength: 1 }
        customerPhone: { type: string, minLength: 1 }
        requestedAmount: { type: number, exclusiveMinimum: true, minimum: 0 }
        tenorMonths: { type: integer, minimum: 1 }
        purpose: { type: string, minLength: 1 }

    ApplicationUpdateRequest:
      type: object
      description: Same fields as ApplicationCreateRequest, all optional — send only what's changing.
      minProperties: 1
      properties:
        branch: { type: string, minLength: 1 }
        productName: { type: string, minLength: 1 }
        customerName: { type: string, minLength: 1 }
        customerPhone: { type: string, minLength: 1 }
        requestedAmount: { type: number, exclusiveMinimum: true, minimum: 0 }
        tenorMonths: { type: integer, minimum: 1 }
        purpose: { type: string, minLength: 1 }

    Application:
      type: object
      properties:
        id: { type: string, format: uuid }
        appNumber: { type: string, example: LN-2026-000001 }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        branch: { type: string }
        productName: { type: string }
        customerName: { type: string }
        customerPhone: { type: string }
        requestedAmount:
          type: string
          description: Decimal serialised as a string (e.g. "50000"). Parse before doing arithmetic.
        tenorMonths: { type: integer }
        purpose: { type: string }
        kycConfirmed: { type: boolean }
        kycConfirmedById: { type: string, format: uuid, nullable: true }
        kycConfirmedAt: { type: string, format: date-time, nullable: true }
        disbursedAmount:
          type: string
          nullable: true
          description: Decimal serialised as a string, same convention as requestedAmount.
        disbursementDate: { type: string, format: date-time, nullable: true }
        disbursementMethod: { type: string, nullable: true }
        disbursementReference: { type: string, nullable: true }
        disbursedById: { type: string, format: uuid, nullable: true }
        disbursedAt: { type: string, format: date-time, nullable: true }
        createdById: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 47 }
        totalPages: { type: integer, example: 3 }

    ApplicationListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Application" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    Approval:
      type: object
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        stage:
          type: string
          nullable: true
          enum: [HOD, CREDIT_REVIEW, INTERNAL_CONTROL, MD, FINANCE, WITHDRAWAL]
          description: Null for query resolutions (they belong to no single stage).
        decision:
          type: string
          enum: [APPROVE, QUERY, DECLINE, REJECT, RESOLVE, WITHDRAW, DISBURSE]
        actorId: { type: string, format: uuid }
        comment: { type: string, nullable: true }
        resultingStatus: { $ref: "#/components/schemas/ApplicationStatus" }
        createdAt: { type: string, format: date-time }

    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    DocumentStatus:
      type: string
      enum: [pending, verified, rejected, expired]

    Document:
      type: object
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        docType: { type: string }
        filename: { type: string, description: Original filename as uploaded }
        storagePath: { type: string, description: Internal; not meaningful to clients }
        version: { type: integer }
        current: { type: boolean, description: True for the latest version of this docType }
        uploadedById: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        uploadedAt: { type: string, format: date-time }
